services:
  - type: web
    name: aft-trust-engine-free-mvp
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY_PEPPER
        sync: false
      - key: BOOTSTRAP_TOKEN
        sync: false
