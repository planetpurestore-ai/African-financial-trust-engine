databases:
  - name: trust-engine-db-replacement
    plan: free
    region: frankfurt
    databaseName: trust_engine_db_replacement
    user: trust_engine_db_replacement_user

services:
  - type: web
    name: african-financial-trust-engine-browser2
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trust-engine-db-replacement
          property: connectionString
      - key: API_KEY_PEPPER
        generateValue: true
      - key: BOOTSTRAP_TOKEN
        generateValue: true
