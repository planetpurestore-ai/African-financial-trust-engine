<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trust Engine — Operations Console</title><style>html,body{margin:0;height:100%;background:#f7f5ef;font-family:system-ui,-apple-system,Segoe UI,sans-serif}iframe{display:block;width:100%;height:100%;border:0}#heading{position:absolute;left:-9999px}</style></head><body><h1 id="heading">Build the evidence package</h1><iframe id="engine" src="/legacy-dashboard" title="Trust Engine"></iframe><script>
const frame=document.getElementById('engine');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument,w=frame.contentWindow;
  const verify=d.getElementById('verify');
  if(!verify)return;
  const box=d.createElement('div');box.className='evidence-card';box.style.borderColor='#c7a34b';box.innerHTML='<h3>Review extracted invoice data</h3><p class="sub">Check and correct the extracted values before verification. The final values are what the engine verifies.</p><div class="grid"><div><label>Invoice Number</label><input id="edit_invoice_number"></div><div><label>Supplier</label><input id="edit_supplier"></div><div><label>Buyer</label><input id="edit_buyer"></div><div><label>Amount</label><input id="edit_amount" type="number" step="0.01"></div><div><label>Currency</label><input id="edit_currency"></div><div><label>Issue Date</label><input id="edit_issue_date" type="date"></div><div><label>Due Date</label><input id="edit_due_date" type="date"></div></div><p class="sub">Corrections here update the verification payload. The original uploaded document remains stored separately.</p>';
  verify.insertBefore(box,verify.children[2]);
  const ids=['invoice_number','supplier','buyer','amount','currency','issue_date','due_date'];
  const inputs={invoice_number:d.getElementById('edit_invoice_number'),supplier:d.getElementById('edit_supplier'),buyer:d.getElementById('edit_buyer'),amount:d.getElementById('edit_amount'),currency:d.getElementById('edit_currency'),issue_date:d.getElementById('edit_issue_date'),due_date:d.getElementById('edit_due_date')};
  function setFromExtraction(){
    const fields=d.getElementById('fields');
    if(!fields)return;
    const vals=[...fields.querySelectorAll('.field')].map(x=>x.innerText.split('\n').slice(1).join('\n').trim());
    if(vals.length>=7){ids.forEach((id,i)=>{if(vals[i]&&vals[i]!=='—')inputs[id].value=vals[i];});}
  }
  setFromExtraction();
  const observer=new MutationObserver(setFromExtraction);const fields=d.getElementById('fields');if(fields)observer.observe(fields,{childList:true,subtree:true});
  const originalFetch=w.fetch.bind(w);
  w.fetch=async function(inputUrl,opts){
    const url=typeof inputUrl==='string'?inputUrl:(inputUrl&&inputUrl.url)||'';
    if(url.endsWith('/v1/transactions')&&opts&&opts.body){
      try{const body=JSON.parse(opts.body);if(body.invoice){body.invoice={...body.invoice,invoice_number:inputs.invoice_number.value.trim(),supplier_name:inputs.supplier.value.trim(),buyer_name:inputs.buyer.value.trim(),amount:inputs.amount.value?Number(inputs.amount.value):body.invoice.amount,currency:inputs.currency.value.trim(),issue_date:inputs.issue_date.value,due_date:inputs.due_date.value};opts={...opts,body:JSON.stringify(body)};}}catch(e){}
    }
    return originalFetch(inputUrl,opts);
  };
});
</script></body></html>
