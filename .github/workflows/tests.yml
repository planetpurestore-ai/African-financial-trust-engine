name: Trust Engine Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify package path
        run: python -c "import sys, app; print(sys.path); print(app.__file__)"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run verification tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Check operational dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/dashboard_operational.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline dashboard scripts found")
          Path("/tmp/aft-dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/aft-dashboard.js

      - name: Verify Alembic migration graph
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          alembic heads
          alembic history | head -n 5

      - name: Apply all migrations to a clean SQLite database
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: sqlite:///./migration-check.db
        run: alembic upgrade head
