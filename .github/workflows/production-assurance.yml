name: Production assurance

on:
  push:
    branches: [main, build/authenticated-trust-engine-app]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - name: Verify public browser endpoint (retry transient deploy/network delays)
        run: |
          set -e
          curl --fail --show-error --silent --location --retry 8 --retry-all-errors --retry-delay 10 --max-time 90 https://aft-trust-engine-free-mvp.onrender.com/health
          echo
          echo "PUBLIC_HTTP_OK"
