name: Trust Engine Production CI

on:
  push:
    branches: [main, production-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Verify public browser endpoint
        run: |
          set -e
          url="https://african-financial-trust-engine-browser2.onrender.com/health"
          for attempt in $(seq 1 12); do
            if curl --fail --show-error --silent --location --max-time 15 "$url"; then
              echo
              echo "PUBLIC_HTTP_OK"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              echo "Endpoint not ready yet (attempt $attempt/12); retrying in 5 seconds."
              sleep 5
            fi
          done
          echo "Public health endpoint did not become ready within the retry window."
          exit 1
