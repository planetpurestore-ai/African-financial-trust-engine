name: Trust Engine Production CI

on:
  push:
    branches: [main, production-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Verify public browser endpoint
        run: |
          set -e
          curl --fail --show-error --silent --location --max-time 30 \
            https://african-financial-trust-engine-browser2.onrender.com/health
          echo
          echo "PUBLIC_HTTP_OK"
